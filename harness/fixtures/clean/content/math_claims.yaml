# 수학 대사의 구조화된 명제 — harness 의 E1(참/거짓)·E2(조건) 검사 대상. 문구는 LocalizationTable 의 line_key
claims:
  - id: claim.coordinate.label
    line_key: label.coordinate.line
    kind: coordinate
    origin: [0, 0]
    moves: [{dir: right, n: 2}, {dir: up, n: 1}]
    states: [2, 1]
    conditions: {origin: [0, 0], axes: x_right_y_up}
  - id: claim.slope.example
    line_key: label.slope.example
    kind: slope
    rise: 2
    run: 1
    states: 2
    conditions: {run_nonzero: true, same_unit: grid_cell}
  - id: claim.slope.compare
    line_key: hint.slope.compare
    kind: slope_compare
    this: {rise: 3, run: 1}
    other: {rise: 1, run: 1}
    states: steeper
    states_text: 더 가팔라
    conditions: {run_nonzero: true, same_unit: grid_cell}
  - id: claim.line.point
    line_key: label.line.point
    kind: line_point
    line: {m: 2, b: 1}
    point: [2, 5]
    states: true
    conditions: {domain: real}
