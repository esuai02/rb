const T=D.locale==='ko'?{...EN,...KO}:EN;
document.documentElement.lang=D.locale==='ko'?'ko':'en';
const $=id=>document.getElementById(id);document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
$('meta').textContent=D.run_id+' / r'+D.revision;$('mission').textContent=D.mission;$('question').textContent=D.question;$('viewtype').textContent=D.kind==='intent_view'?T.initial:T.working;$('note').placeholder=T.placeholder;$('fingerprint').textContent='snapshot '+D.snapshot.slice(0,20);$('mermaid').textContent=D.mermaid;
$('omitted').textContent=T.shown+': '+D.scope_ids.join(', ')+' | '+T.omitted+': '+(D.omitted_ids.join(', ')||T.none);
const nodes=new Map(D.nodes.map(n=>[n.id,n]));const levels=new Map();
function level(id){if(levels.has(id))return levels.get(id);const deps=nodes.get(id).depends_on.filter(d=>nodes.has(d));const value=deps.length?1+Math.max(...deps.map(level)):0;levels.set(id,value);return value;}
D.nodes.forEach(n=>level(n.id));const groups=[];D.nodes.forEach(n=>(groups[level(n.id)]??=[]).push(n));
$('lanes').style.gridTemplateColumns='repeat('+groups.length+', minmax(190px, 1fr))';$('lanes').style.minWidth=(groups.length*190+(groups.length-1)*40)+'px';
let selected=D.focus;const notes=[];
function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;}
function centerSelected(){const target=document.querySelector('[data-id="'+selected+'"]');if(!target)return;const outer=$('scroll').getBoundingClientRect(),inner=target.getBoundingClientRect();$('scroll').scrollLeft+=(inner.left+inner.width/2)-(outer.left+outer.width/2);}
function show(id){selected=id;requestAnimationFrame(centerSelected);$('target').textContent=T.select+': '+id;document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const n=nodes.get(id);$('detailid').textContent=id;$('criteria').replaceChildren();if(n){$('question').textContent=n.review_question||D.question;$('detailtitle').textContent=n.label;$('outcome').textContent=n.outcome;const cs=n.criteria||[];if(cs.length)cs.forEach(c=>$('criteria').append(el('li','',c.statement+' / '+c.target)));else $('criteria').append(el('li','',T.nocriteria));}else{$('question').textContent=D.question;const edge=D.edges.find(e=>e.id===id);$('detailtitle').textContent=T.edge;$('outcome').textContent=edge.from+' \u2192 '+edge.to;$('criteria').append(el('li','',T.legend));}
$('evidence').replaceChildren();const relevant=D.evidence.filter(e=>e.node_id===id||e.kind==='benchmark');if(!relevant.length)$('evidence').append(el('p','hint',T.noevidence));else relevant.forEach(e=>{const row=el('div','evidenceitem');row.append(el('strong','',e.id+' / '+e.kind),el('div','',e.observed||e.summary||e.verdict||e.result||''));if(e.source)row.append(el('div','',e.source));$('evidence').append(row);});}
for(const group of groups){const lane=el('div','lane');for(const n of group){const b=el('button','node');b.type='button';b.dataset.id=n.id;b.setAttribute('aria-pressed','false');const top=el('div','nodetop');top.append(el('span','nodeid',n.id),el('span','status',D.statuses[n.id]));b.append(top,el('strong','',n.label),el('p','',n.outcome));b.addEventListener('click',()=>show(n.id));lane.append(b);}$('lanes').append(lane);}
const NS='http://www.w3.org/2000/svg';function svgEl(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;}
function draw(){const svg=$('edges'),box=$('canvas').getBoundingClientRect();svg.replaceChildren();svg.setAttribute('width',$('lanes').scrollWidth);svg.setAttribute('height',$('lanes').scrollHeight);const defs=svgEl('defs',{}),marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#8a9eaa'}));defs.append(marker);svg.append(defs);D.edges.forEach(e=>{const a=document.querySelector('[data-id="'+e.from+'"]').getBoundingClientRect(),b=document.querySelector('[data-id="'+e.to+'"]').getBoundingClientRect();const x1=a.right-box.left,y1=a.top-box.top+a.height/2,x2=b.left-box.left,y2=b.top-box.top+b.height/2;const d='M '+x1+' '+y1+' C '+(x1+20)+' '+y1+', '+(x2-20)+' '+y2+', '+x2+' '+y2;svg.append(svgEl('path',{d,fill:'none',stroke:'#8a9eaa','stroke-width':'1.5','marker-end':'url(#arrow)'}));const hit=svgEl('rect',{x:(x1+x2)/2-11,y:(y1+y2)/2-12,width:'22',height:'24',rx:'5',fill:'transparent',tabindex:'0',role:'button','aria-label':T.edge+' '+e.from+' to '+e.to,'data-edge':e.id});hit.style.cursor='pointer';hit.addEventListener('click',()=>show(e.id));hit.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show(e.id);}});svg.append(hit);});centerSelected();}
show(selected);requestAnimationFrame(draw);new ResizeObserver(draw).observe($('lanes'));
$('note').addEventListener('input',()=>{$('charcount').textContent=$('note').value.length+' / 4000';$('add').disabled=!$('note').value.trim();});
function refreshNotes(){$('notes').replaceChildren();notes.forEach((n,i)=>{const li=el('li','');const remove=el('button','',T.remove);remove.type='button';remove.addEventListener('click',()=>{notes.splice(i,1);refreshNotes();$('status').textContent=T.deleted;});li.append(remove,el('strong','',n.target_id+' / '+T[n.category]),el('div','',n.text));$('notes').append(li);});$('notecount').textContent=String(notes.length);$('export').disabled=!notes.length;}
$('add').addEventListener('click',()=>{const value=$('note').value.trim();if(!value)return;if(notes.length>=30){$('status').textContent=T.limit;return;}notes.push({target_id:selected,category:$('category').value,text:value});$('note').value='';$('charcount').textContent='0 / 4000';$('add').disabled=true;refreshNotes();$('status').textContent=T.added;});
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').addEventListener('click',()=>{const result={schema_version:1,run_id:D.run_id,revision:D.revision,snapshot:D.snapshot,scope_ids:D.scope_ids,notes};download('masterwork-feedback-r'+D.revision+'.json',JSON.stringify(result,null,2),'application/json');$('status').textContent=T.exported;});
$('savemmd').addEventListener('click',()=>download('masterwork-diagram-r'+D.revision+'.mmd',D.mermaid,'text/plain'));
window.addEventListener('beforeunload',e=>{if(notes.length){e.preventDefault();e.returnValue='';}});
</script></body></html>
